[package]
name = "vex-vpn"
version = "0.1.0"
edition = "2021"
description = "GTK4/libadwaita GUI for the vexos-vpn PIA backend"
license = "MIT"

[[bin]]
name = "vex-vpn"
path = "src/main.rs"

[lib]
name = "vex_vpn"
path = "src/lib.rs"

[dependencies]
# GTK4 GUI — 0.7.x is compatible with Rust 1.75+
gtk4 = { version = "0.7", features = ["v4_10"] }
# libadwaita 0.5.x matches gtk4 0.7.x series
libadwaita = { version = "0.5", features = ["v1_4"] }
glib = "0.18"
gio = "0.18"

# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus — zbus 3.x is compatible with Rust 1.75
zbus = { version = "3", features = ["tokio"] }

# JSON parsing (vexos-vpn status/regions output)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System tray (KStatusNotifierItem)
ksni = "0.2"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Desktop notifications via org.freedesktop.Notifications (D-Bus, Wayland+X11)
notify-rust = "4"

# Async MPMC channel for tray→UI messages (B1)
async-channel = "2"

[dev-dependencies]
# Temporary directory for the fake pkexec used by tests/login_stdin.rs
tempfile = "3"

[build-dependencies]
glib-build-tools = "0.18"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
